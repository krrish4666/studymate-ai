<!DOCTYPE html>
<html lang="en" data-theme="warm-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — StudyMate AI HUB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/" style="display:block;text-align:center;margin-bottom:8px;font-family:var(--font-heading);font-size:1.5rem;font-weight:700;color:var(--color-primary);">StudyMate AI</a>
      <h1>Create account</h1>
      <p class="subtitle">Start learning smarter with AI</p>

      <div id="error-message" style="color:var(--color-error);font-size:0.85rem;margin-bottom:12px;display:none;"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-input" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" class="form-input" placeholder="Min 8 characters" minlength="8" required>
            <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password" tabindex="-1">
              <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eye-slash-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Create Account</button>
      </form>

      <p style="text-align:center;margin-top:20px;font-size:0.85rem;color:var(--color-muted-text);">
        Already have an account? <a href="/login">Sign in</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { register, redirectIfAuthenticated } from '/static/js/auth.js?v=3';
    import { showToast } from '/static/js/utils.js?v=2';
    redirectIfAuthenticated();

    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('password-toggle');
    const eyeIcon = document.getElementById('eye-icon');
    const eyeSlashIcon = document.getElementById('eye-slash-icon');
    toggleBtn.addEventListener('click', () => {
      const showing = passwordInput.type === 'text';
      passwordInput.type = showing ? 'password' : 'text';
      eyeIcon.style.display = showing ? '' : 'none';
      eyeSlashIcon.style.display = showing ? 'none' : '';
      toggleBtn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('error-message');
      errEl.style.display = 'none';

      try {
        await register(name, email, password);
        showToast('Account created!', 'success');
        setTimeout(() => { window.location.href = '/'; }, 500);
      } catch (err) {
        errEl.textContent = err.detail || 'Registration failed';
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
